<title>Farmaura Operações</title>
<!-- Self-contained build: React/ReactDOM 18.2.0 inlined, JSX precompiled at build time (classic runtime), babel-standalone and all CDN <script src> removed. Only Google Fonts is fetched cross-origin. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;600;700;800&family=Spline+Sans+Mono:wght@500;600&display=swap">
<style>
  :root{
    color-scheme: light;
    --bg:#faf7f5; --surface:#ffffff; --surface-2:#f1ebe9; --surface-3:#e8e1df;
    --text-primary:#2b1a1a; --text-secondary:#6b5757; --text-muted:#746868;
    --border:rgba(43,26,26,0.11); --border-strong:rgba(43,26,26,0.18);
    /* brand = crimson chrome (rail, logo, brand marks). accent = the primary action (teal), reserved and rare. */
    --brand:#a11017;
    --heat:161,16,23; /* RGB triple for the movement-heatmap intensity scale */
    --accent:#0f6b60; --accent-hover:#0b564d; --accent-contrast:#ffffff; --accent-soft:#e3f1ee; --accent-soft-strong:#c6e6df;
    --good:#1f6b49; --good-soft:#e4f1eb; --warning:#8a5514; --warning-soft:#fceedb; --serious:#9a3f14; --serious-soft:#f8e3d5; --critical:#b3261e; --critical-soft:#fbe2e2;
    --series-1:#2a78d6; --series-2:#eb6834; --series-3:#1baf7a; --series-4:#eda100; --series-5:#e87ba4; --series-6:#3a6ea5; --series-7:#4a3aa7; --series-8:#e34948;
    --shadow-sm: 0 1px 2px rgba(43,26,26,0.05), 0 1px 3px rgba(43,26,26,0.06);
    --shadow-md: 0 4px 14px rgba(43,26,26,0.07), 0 2px 6px rgba(43,26,26,0.05);
    --shadow-lg: 0 18px 50px rgba(43,26,26,0.13), 0 6px 16px rgba(43,26,26,0.07);
    --rail-bg:var(--brand); --rail-bg-2:rgba(255,255,255,0.08); --rail-bg-active:#ffffff; --rail-text:#ffffff; --rail-text-muted:rgba(255,255,255,0.66); --rail-accent:#ffd5d5; --rail-border:rgba(255,255,255,0.14);
    --font-display:'Nunito Sans', system-ui, -apple-system, sans-serif;
    --font-body:'Nunito Sans', system-ui, -apple-system, sans-serif;
    --font-mono:'Spline Sans Mono', ui-monospace, 'SF Mono', Menlo, monospace;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      color-scheme: dark;
      --bg:#1c1211; --surface:#241816; --surface-2:#2e201d; --surface-3:#3a2724;
      --text-primary:#f5ede9; --text-secondary:#cbb8b5; --text-muted:#9c8683;
      --border:rgba(255,232,224,0.10); --border-strong:rgba(255,232,224,0.17);
      --accent:#3fb9a8; --accent-hover:#5accba; --accent-contrast:#052b26; --accent-soft:rgba(63,185,168,0.16); --accent-soft-strong:rgba(63,185,168,0.30); --heat:234,120,110;
      --good:#5fce9a; --good-soft:rgba(95,206,154,0.14); --warning:#f0b429; --warning-soft:rgba(240,180,41,0.14); --serious:#ef8b63; --serious-soft:rgba(239,139,99,0.14); --critical:#f16565; --critical-soft:rgba(241,101,101,0.14);
      --series-1:#3987e5; --series-2:#d95926; --series-3:#199e70; --series-4:#c98500; --series-5:#d55181; --series-6:#5b96d6; --series-7:#9085e9; --series-8:#e66767;
      --shadow-sm: 0 1px 2px rgba(0,0,0,0.3);
      --shadow-md: 0 6px 20px rgba(0,0,0,0.35);
      --shadow-lg: 0 20px 48px rgba(0,0,0,0.5);
    }
  }
  :root[data-theme="dark"]{
    color-scheme: dark;
    --bg:#1c1211; --surface:#241816; --surface-2:#2e201d; --surface-3:#3a2724;
    --text-primary:#f5ede9; --text-secondary:#cbb8b5; --text-muted:#9c8683;
    --border:rgba(255,232,224,0.10); --border-strong:rgba(255,232,224,0.17);
    --accent:#3fb9a8; --accent-hover:#5accba; --accent-contrast:#052b26; --accent-soft:rgba(63,185,168,0.16); --accent-soft-strong:rgba(63,185,168,0.30); --heat:234,120,110;
    --good:#5fce9a; --good-soft:rgba(95,206,154,0.14); --warning:#f0b429; --warning-soft:rgba(240,180,41,0.14); --serious:#ef8b63; --serious-soft:rgba(239,139,99,0.14); --critical:#f16565; --critical-soft:rgba(241,101,101,0.14);
    --series-1:#3987e5; --series-2:#d95926; --series-3:#199e70; --series-4:#c98500; --series-5:#d55181; --series-6:#5b96d6; --series-7:#9085e9; --series-8:#e66767;
    --shadow-sm: 0 1px 2px rgba(0,0,0,0.3);
    --shadow-md: 0 6px 20px rgba(0,0,0,0.35);
    --shadow-lg: 0 20px 48px rgba(0,0,0,0.5);
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg); color:var(--text-primary);
    font-family:var(--font-body); font-size:14px; line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,h4{font-family:var(--font-display); margin:0; color:var(--text-primary); text-wrap:balance;}
  p{margin:0;}
  button{font-family:inherit;}
  input,select,textarea{font-family:inherit; color:inherit;}
  ::selection{background:var(--accent-soft-strong);}
  .mono{font-family:var(--font-mono);}
  .tnum{font-variant-numeric:tabular-nums;}
  a{color:inherit;}
  .sr-only{position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0;}
  figure.chart-fig{margin:0;}
  figure.chart-fig:focus-visible{outline:2px solid var(--accent); outline-offset:3px; border-radius:6px;}

  /* ---------- app shell ---------- */
  .app-shell{display:flex; min-height:100vh; width:100%;}
  .rail{
    width:264px; flex:none; background:var(--rail-bg); color:var(--rail-text);
    display:flex; flex-direction:column; height:100vh; position:sticky; top:0;
    border-right:1px solid var(--rail-border);
    transition:width .22s cubic-bezier(.4,0,.2,1);
    overflow:hidden;
  }
  .rail.collapsed{width:76px;}
  .rail-brand{display:flex; align-items:center; gap:10px; padding:18px 18px 14px; flex:none;}
  .rail.collapsed .rail-brand{justify-content:center; padding:18px 0 14px;}
  .rail-brand-mark{width:34px;height:34px;border-radius:10px;background:#ffffff;display:flex;align-items:center;justify-content:center;flex:none; box-shadow:0 2px 8px rgba(43,26,26,.28);}
  .rail-brand-name{font-family:var(--font-display); font-weight:800; font-size:16.5px; letter-spacing:-0.01em; white-space:nowrap;}
  .rail-brand-sub{font-size:10.5px; color:var(--rail-text-muted); letter-spacing:.06em; text-transform:uppercase; white-space:nowrap;}
  .rail-store{margin:2px 14px 12px; padding:9px 10px; border-radius:10px; background:var(--rail-bg-2); display:flex; align-items:center; gap:8px; cursor:pointer; border:1px solid var(--rail-border);}
  .rail-store-dot{width:7px;height:7px;border-radius:50%;background:var(--rail-accent); flex:none; box-shadow:0 0 0 3px rgba(255,255,255,.22);}
  button.rail-store{width:calc(100% - 28px); font:inherit; text-align:left;}
  button.rail-store:focus-visible{outline:2px solid var(--rail-accent); outline-offset:1px;}
  .rail-store-opt{display:block; width:100%; padding:8px 12px; font:inherit; font-size:12px; text-align:left; color:var(--rail-text); background:transparent; border:0; cursor:pointer;}
  .rail-store-opt[aria-checked="true"]{background:rgba(255,255,255,0.14);}
  .rail-store-opt:hover{background:rgba(255,255,255,0.09);}
  .rail-store-opt:focus-visible{outline:2px solid var(--rail-accent); outline-offset:-2px;}
  .rail-store-text{flex:1; min-width:0;}
  .rail-store-name{font-size:12.5px; font-weight:600; color:var(--rail-text); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .rail-store-meta{font-size:10.5px; color:var(--rail-text-muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .rail-nav{flex:1; overflow-y:auto; padding:4px 10px 14px;}
  .rail.collapsed .rail-nav{padding:4px 12px 14px;}
  .rail-nav::-webkit-scrollbar{width:6px;}
  .rail-nav::-webkit-scrollbar-thumb{background:rgba(255,255,255,.12); border-radius:3px;}
  .rail-group{margin-top:14px;}
  .rail-group:first-child{margin-top:2px;}
  .rail.collapsed .rail-group{margin-top:10px;}
  .rail-group-label{font-size:10px; font-weight:700; letter-spacing:.09em; text-transform:uppercase; color:var(--rail-text-muted); padding:0 10px 6px;}
  .rail-item{
    display:flex; align-items:center; gap:11px; padding:8.5px 10px; border-radius:10px; cursor:pointer;
    color:var(--rail-text-muted); font-size:13px; font-weight:700; margin-bottom:1px; position:relative;
    border:1px solid transparent; width:100%; text-align:left; background:none; font-family:inherit;
  }
  .rail.collapsed .rail-item{justify-content:center; padding:9px 0;}
  .rail-item-icon-wrap{position:relative; display:inline-flex; flex:none;}
  .rail-item-dot{position:absolute; top:-3px; right:-4px; width:7px; height:7px; border-radius:50%; background:var(--critical); border:1.5px solid var(--rail-bg);}
  .rail-item svg{flex:none;}
  .rail-item:hover{background:var(--rail-bg-2); color:var(--rail-text);}
  .rail-item.active{background:var(--rail-bg-active); color:var(--accent); border-color:transparent; box-shadow:var(--shadow-sm);}
  .rail-item-label{white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .rail-item-badge{margin-left:auto; font-size:10.5px; font-weight:700; background:var(--critical); color:#fff; border-radius:999px; padding:1px 6px; flex:none;}
  .rail-foot{padding:12px 14px 16px; border-top:1px solid var(--rail-border); flex:none;}
  .rail-user{display:flex; align-items:center; gap:9px; cursor:pointer;}
  .rail-avatar{width:32px;height:32px;border-radius:9px;background:var(--rail-bg-2); display:flex; align-items:center; justify-content:center; font-weight:700; font-size:12.5px; flex:none; color:var(--rail-accent); border:1px solid var(--rail-border);}
  .rail-user-name{font-size:12.5px; font-weight:700; color:var(--rail-text); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .rail-user-role{font-size:10.5px; color:var(--rail-text-muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .rail-collapse-btn{background:none;border:none;color:var(--rail-text-muted); cursor:pointer; padding:6px; border-radius:7px; display:flex;}
  .rail-collapse-btn:hover{background:var(--rail-bg-2); color:#fff;}

  .main-col{flex:1; min-width:0; display:flex; flex-direction:column; min-height:100vh;}
  .topbar{
    height:60px; flex:none; display:flex; align-items:center; gap:14px; padding:0 22px;
    background:var(--surface); border-bottom:1px solid var(--border); position:sticky; top:0; z-index:20;
  }
  .topbar-crumb{display:flex; align-items:center; gap:6px; min-width:0; font-size:12.5px; color:var(--text-muted);}
  .topbar-crumb svg{flex:none; opacity:.6;}
  .topbar-crumb-group{white-space:nowrap;}
  .topbar-crumb-page{font-family:var(--font-display); font-weight:800; font-size:15px; color:var(--text-primary); letter-spacing:-.01em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  @media (max-width:560px){ .topbar-crumb-group, .topbar-crumb svg{display:none;} }
  .topbar-pop-scrim{position:fixed; inset:0; z-index:59;}
  .topbar-pop{position:absolute; right:0; top:calc(100% + 8px); z-index:60; width:290px; max-width:calc(100vw - 24px);
    background:var(--surface); border:1px solid var(--border); border-radius:12px; box-shadow:var(--shadow-lg); overflow:hidden;
    animation:drop-in .14s cubic-bezier(.16,1,.3,1);}
  .topbar-pop-head{padding:11px 13px 8px; font-size:10.5px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--text-muted);}
  .topbar-pop-empty{padding:6px 13px 16px; font-size:12.5px; color:var(--text-muted);}
  .topbar-pop-item{display:flex; align-items:center; gap:10px; width:100%; text-align:left; border:none; background:none; font-family:inherit;
    padding:10px 13px; font-size:12.5px; font-weight:600; color:var(--text-primary); cursor:pointer; transition:background .12s ease;}
  .topbar-pop-item:hover{background:var(--surface-2);}
  .topbar-pop-icon{display:flex; flex:none; color:var(--warning);}
  .topbar-pop-count{flex:none; min-width:20px; text-align:center; font-weight:800; font-size:11px; color:var(--accent-contrast);
    background:var(--accent); border-radius:999px; padding:1px 6px;}
  .topbar-search{
    display:flex; align-items:center; gap:8px; background:var(--surface-2); border:1px solid var(--border);
    border-radius:10px; padding:7px 11px; width:300px; color:var(--text-muted); font-size:12.5px;
  }
  .topbar-search input{background:none;border:none;outline:none;width:100%;color:var(--text-primary); font-size:12.5px;}
  .topbar-actions{margin-left:auto; display:flex; align-items:center; gap:8px;}
  .icon-btn{
    width:34px;height:34px;border-radius:9px; border:1px solid var(--border); background:var(--surface);
    display:flex; align-items:center; justify-content:center; cursor:pointer; color:var(--text-secondary); position:relative;
  }
  .icon-btn:hover{background:var(--surface-2); color:var(--text-primary);}
  .dot-ping{position:absolute; top:6px; right:6px; width:7px;height:7px;border-radius:50%; background:var(--critical); border:1.5px solid var(--surface);}
  .content{flex:1; padding:22px 26px 40px; max-width:1480px; width:100%; margin:0 auto;}

  /* ---------- generic components ---------- */
  .page-head{display:flex; align-items:flex-start; justify-content:space-between; gap:16px; margin-bottom:20px; flex-wrap:wrap;}
  .page-eyebrow{font-size:11px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--accent); margin-bottom:5px;}
  .page-title{font-size:23px; font-weight:800; letter-spacing:-.015em;}
  .page-desc{font-size:13px; color:var(--text-secondary); margin-top:5px; max-width:64ch;}
  .page-actions{display:flex; gap:8px; align-items:center; flex-wrap:wrap;}

  .btn{
    display:inline-flex; align-items:center; gap:7px; font-size:12.5px; font-weight:700; border-radius:12px;
    padding:8.5px 14px; cursor:pointer; border:1px solid transparent; white-space:nowrap; font-family:var(--font-body);
  }
  .btn-primary{background:var(--accent); color:var(--accent-contrast);}
  .btn-primary:hover{background:var(--accent-hover);}
  .btn-secondary{background:var(--surface); color:var(--text-primary); border-color:var(--border-strong);}
  .btn-secondary:hover{background:var(--surface-2);}
  .btn-ghost{background:none; color:var(--text-secondary); border-color:transparent;}
  .btn-ghost:hover{background:var(--surface-2); color:var(--text-primary);}
  .btn-danger{background:var(--critical-soft); color:var(--critical); border-color:var(--critical);}
  .btn-sm{padding:6px 10px; font-size:11.5px; border-radius:7px;}
  .btn[disabled]{opacity:.45; cursor:not-allowed;}

  .card{background:var(--surface); border:1px solid var(--border); border-radius:16px; box-shadow:var(--shadow-sm);}
  .card-pad{padding:18px;}
  .card-head{display:flex; align-items:center; justify-content:space-between; padding:15px 18px; border-bottom:1px solid var(--border); gap:10px;}
  button.card-head{width:100%; text-align:left; background:none; font:inherit; color:inherit; cursor:pointer;}
  button.card-head:focus-visible{outline:2px solid var(--accent); outline-offset:-2px;}
  .card-head h3{font-size:14px; font-weight:700;}
  .card-head-sub{font-size:11.5px; color:var(--text-muted); margin-top:2px;}

  .grid{display:grid; gap:16px;}
  .g-5{grid-template-columns:repeat(5,1fr);}
  .g-4{grid-template-columns:repeat(4,1fr);}
  .g-3{grid-template-columns:repeat(3,1fr);}
  .g-2{grid-template-columns:repeat(2,1fr);}
  .g-12{grid-template-columns:repeat(12,1fr);}
  @media (max-width:1100px){.g-5{grid-template-columns:repeat(3,1fr);} .g-4{grid-template-columns:repeat(2,1fr);} .g-3{grid-template-columns:repeat(2,1fr);}}
  @media (max-width:680px){.g-5,.g-4,.g-3,.g-2{grid-template-columns:1fr;}}

  .stat-card{background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:16px 17px; box-shadow:var(--shadow-sm); display:flex; flex-direction:column; gap:9px;}
  .stat-top{display:flex; align-items:center; justify-content:space-between;}
  .stat-icon{width:32px;height:32px;border-radius:9px; display:flex; align-items:center; justify-content:center; flex:none;}
  .stat-label{font-size:12px; color:var(--text-secondary); font-weight:600;}
  .stat-value{font-size:23px; font-weight:800; font-family:var(--font-display); letter-spacing:-.01em;}
  .stat-delta{font-size:11.5px; font-weight:700; display:inline-flex; align-items:center; gap:3px; width:fit-content; padding:2px 7px; border-radius:999px;}
  .stat-delta.up{color:var(--good); background:var(--good-soft);}
  .stat-delta.down{color:var(--critical); background:var(--critical-soft);}
  .stat-delta.flat{color:var(--text-muted); background:var(--surface-2);}

  .badge{display:inline-flex; align-items:center; gap:5px; font-size:11px; font-weight:700; padding:3px 9px; border-radius:999px; white-space:nowrap; line-height:1.5;}
  .badge svg{width:11px;height:11px;}
  .badge-good{background:var(--good-soft); color:var(--good);}
  .badge-warning{background:var(--warning-soft); color:var(--warning);}
  .badge-serious{background:var(--serious-soft); color:var(--serious);}
  .badge-critical{background:var(--critical-soft); color:var(--critical);}
  .badge-neutral{background:var(--surface-2); color:var(--text-secondary);}
  .badge-accent{background:var(--accent-soft); color:var(--accent);}
  .badge-dot{width:6px;height:6px;border-radius:50%; background:currentColor; flex:none;}

  .tier-diamante{background:#e3ecfb; color:#2a5aa8;}
  .tier-ouro{background:#fbeecd; color:#946110;}
  .tier-prata{background:#e7e9ea; color:#5b6266;}
  .tier-bronze{background:#f3ddc9; color:#8a4c1e;}
  :root:not([data-theme="light"]) .tier-diamante, :root[data-theme="dark"] .tier-diamante{background:rgba(90,150,230,.18); color:#8fbcf5;}
  :root:not([data-theme="light"]) .tier-ouro, :root[data-theme="dark"] .tier-ouro{background:rgba(240,180,41,.16); color:#f0b429;}
  :root:not([data-theme="light"]) .tier-prata, :root[data-theme="dark"] .tier-prata{background:rgba(255,255,255,.10); color:#c3c2b7;}
  :root:not([data-theme="light"]) .tier-bronze, :root[data-theme="dark"] .tier-bronze{background:rgba(217,89,38,.16); color:#e69a5f;}

  table{width:100%; border-collapse:collapse; font-size:12.75px;}
  .table-wrap{overflow-x:auto;}
  thead th{
    text-align:left; font-size:10.5px; font-weight:700; text-transform:uppercase; letter-spacing:.05em;
    color:var(--text-secondary); padding:10px 14px; background:var(--surface-2); white-space:nowrap; position:sticky; top:0;
  }
  thead th:first-child{border-top-left-radius:0;}
  tbody td{padding:11px 14px; border-top:1px solid var(--border); color:var(--text-primary); vertical-align:middle;}
  tbody tr:hover{background:var(--surface-2);}
  tbody tr.clickable{cursor:pointer;}
  .cell-muted{color:var(--text-muted);}
  .cell-strong{font-weight:700;}
  .link-cell{color:var(--accent); font-weight:700;}
  tr.clickable:hover .link-cell{text-decoration:underline;}

  .identify-search{display:flex; align-items:center; gap:10px; border:1.5px solid var(--border-strong); border-radius:12px; padding:12px 16px; background:var(--surface); color:var(--text-muted); transition:border-color .15s, box-shadow .15s;}
  .identify-search:focus-within{border-color:var(--accent); box-shadow:0 0 0 4px var(--accent-soft); color:var(--accent);}
  .identify-search input{flex:1; border:none; outline:none; background:none; font-size:13.5px; color:var(--text-primary); font-family:inherit;}
  .identify-search input::placeholder{color:var(--text-muted);}
  .identify-result{display:flex; align-items:center; gap:10px; padding:10px 12px; cursor:pointer; border:none; border-bottom:1px solid var(--border); transition:background .1s; width:100%; text-align:left; background:none; color:inherit; font:inherit;}
  .identify-result:last-child{border-bottom:none;}
  .identify-result:hover{background:var(--surface-2);}
  .row-actions{display:flex; gap:4px; justify-content:flex-end;}

  .tabs{display:flex; gap:4px; border-bottom:1px solid var(--border); margin-bottom:18px; overflow-x:auto;}
  .tab{padding:9px 3px; margin-right:20px; font-size:13px; font-weight:700; color:var(--text-muted); cursor:pointer; border:none; border-bottom:2px solid transparent; white-space:nowrap; background:none; font-family:inherit;}
  .tab:hover{color:var(--text-primary);}
  .tab.active{color:var(--accent); border-color:var(--accent);}
  .tab-count{font-size:10.5px; background:var(--surface-2); padding:1px 6px; border-radius:999px; margin-left:6px; font-weight:700;}

  .pillnav{display:flex; gap:6px; background:var(--surface-2); padding:3px; border-radius:10px; width:fit-content;}
  .pillnav button{border:none; background:none; padding:7px 13px; border-radius:8px; font-size:12px; font-weight:700; color:var(--text-secondary); cursor:pointer;}
  .pillnav button.active{background:var(--surface); color:var(--text-primary); box-shadow:var(--shadow-sm);}

  .field{display:flex; flex-direction:column; gap:6px;}
  .field label{font-size:11.5px; font-weight:700; color:var(--text-secondary);}
  .field .hint{font-size:10.5px; color:var(--text-muted); font-weight:500;}
  .input, select.input, textarea.input{
    border:1px solid var(--border-strong); background:var(--surface); border-radius:10px; padding:8.5px 10px; font-size:12.75px; color:var(--text-primary); outline:none; width:100%;
  }
  .input:focus{border-color:var(--accent); box-shadow:0 0 0 4px var(--accent-soft);}
  .switch{width:36px;height:20px;border-radius:999px; background:var(--surface-3); position:relative; cursor:pointer; flex:none; border:1px solid var(--border-strong); padding:0; display:inline-block;}
  .switch::before{content:""; position:absolute; left:0; right:0; top:50%; transform:translateY(-50%); height:24px; min-width:24px;} /* WCAG 2.5.8: 24px hit target without enlarging the visual track */
  .switch.on{background:var(--accent); border-color:var(--accent);}
  .switch .knob{position:absolute; top:1.5px; left:2px; width:15px;height:15px;border-radius:50%; background:#fff; transition:left .15s; box-shadow:0 1px 2px rgba(0,0,0,.3);}
  .switch.on .knob{left:17px;}
  .icon-picker{display:grid; grid-template-columns:repeat(9,1fr); gap:6px; max-height:184px; overflow-y:auto; padding:8px; border:1px solid var(--border-strong); border-radius:10px; background:var(--surface);}
  .icon-picker-item{display:flex; align-items:center; justify-content:center; aspect-ratio:1; border-radius:8px; border:1px solid transparent; background:var(--surface-2); color:var(--text-secondary); cursor:pointer;}
  .icon-picker-item:hover{border-color:var(--accent); color:var(--accent);}
  .icon-picker-item.active{background:var(--accent); color:var(--accent-contrast); border-color:var(--accent);}

  .modal-overlay{position:fixed; inset:0; background:rgba(8,12,10,.5); display:flex; align-items:center; justify-content:center; z-index:100; padding:24px; backdrop-filter:blur(1.5px);}
  .modal{background:var(--surface); border-radius:20px; width:100%; max-width:560px; max-height:88vh; display:flex; flex-direction:column; box-shadow:var(--shadow-lg); border:1px solid var(--border);}
  .modal.wide{max-width:820px;}
  .modal-head{display:flex; align-items:center; justify-content:space-between; padding:16px 20px; border-bottom:1px solid var(--border); flex:none;}
  .modal-body{padding:18px 20px; overflow-y:auto;}
  .modal-foot{padding:14px 20px; border-top:1px solid var(--border); display:flex; justify-content:flex-end; gap:8px; flex:none;}

  .drawer-overlay{position:fixed; inset:0; background:rgba(8,12,10,.45); z-index:100; display:flex; justify-content:flex-end;}
  .drawer{width:100%; max-width:460px; background:var(--surface); height:100%; box-shadow:var(--shadow-lg); display:flex; flex-direction:column; border-left:1px solid var(--border);}
  .drawer-head{padding:18px 20px; border-bottom:1px solid var(--border); flex:none; display:flex; justify-content:space-between; align-items:flex-start; gap:10px;}
  .drawer-body{padding:18px 20px; overflow-y:auto; flex:1;}

  .empty{display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:50px 20px; color:var(--text-muted); gap:8px;}
  .empty svg{opacity:.5;}
  .empty-title{font-weight:700; color:var(--text-secondary); font-size:13px;}

  .kv{display:flex; justify-content:space-between; gap:12px; padding:8px 0; border-bottom:1px dashed var(--border); font-size:12.5px;}
  .kv:last-child{border-bottom:none;}
  .kv-label{color:var(--text-muted);}
  .kv-value{font-weight:700; text-align:right;}

  .avatar{border-radius:50%; display:flex; align-items:center; justify-content:center; font-weight:700; flex:none; background:var(--accent-soft); color:var(--accent);}

  .scrollbar-thin::-webkit-scrollbar{width:6px; height:6px;}
  .scrollbar-thin::-webkit-scrollbar-thumb{background:var(--border-strong); border-radius:3px;}

  /* PDV specific */
  .pdv-shell{display:grid; grid-template-columns:1fr 360px; gap:16px; height:calc(100vh - 60px - 44px);}
  .pdv-cart{display:flex; flex-direction:column; background:var(--surface); border:1px solid var(--border); border-radius:14px; overflow:hidden; align-self:start; max-height:100%;}
  .pdv-cart-items{overflow-y:auto; padding:6px 14px;}
  .pdv-cart-line{display:flex; gap:10px; align-items:center; padding:10px 0; border-bottom:1px solid var(--border);}
  .rx-tag{display:inline-flex; align-items:center; gap:4px; border:none; border-radius:999px; padding:2.5px 8px 2.5px 7px; font-size:10px; font-weight:700; cursor:pointer; background:var(--warning-soft); color:var(--warning); margin-top:4px;}
  .rx-tag.done{background:var(--good-soft); color:var(--good);}
  .rx-tag-static{cursor:default;}
  .pdv-rx-blocked-note{display:flex; align-items:flex-start; gap:8px; margin:0 14px 12px; padding:10px 12px; border-radius:10px; background:var(--critical-soft); color:var(--critical); font-size:11.5px; font-weight:600; line-height:1.4;}
  .order-stepper{display:flex; flex-direction:column; margin-bottom:14px;}
  .order-step{display:flex; gap:10px;}
  .order-step-rail{display:flex; flex-direction:column; align-items:center; flex:none;}
  .order-step-dot{width:22px; height:22px; border-radius:50%; display:flex; align-items:center; justify-content:center; background:var(--surface-2); color:var(--text-muted); flex:none;}
  .order-step-dot.done{background:var(--good); color:#fff;}
  .order-step-dot.current{background:var(--accent); color:var(--accent-contrast);}
  .order-step-line{width:2px; flex:1; min-height:12px; background:var(--border); margin:2px 0;}
  .order-step-line.done{background:var(--good);}
  .order-step-content{padding-bottom:16px;}
  .order-step:last-child .order-step-content{padding-bottom:0;}
  .order-step-label{font-size:12.5px; font-weight:700; color:var(--text-primary);}
  .order-step-label.upcoming{color:var(--text-muted); font-weight:600;}
  .order-step-sub{font-size:11px; color:var(--text-muted); margin-top:2px;}
  .order-action{padding:12px; border-radius:10px; background:var(--surface-2);}
  .order-action.blocked{background:var(--warning-soft);}
  .rx-doc-card{display:flex; align-items:center; gap:10px; border:1px solid var(--border); border-radius:12px; padding:12px; margin-top:14px;}
  .rx-sheet{background:var(--surface); border:1px solid var(--border-strong); border-radius:14px; padding:24px;}
  .rx-sheet-head{display:flex; justify-content:space-between; align-items:flex-start; padding-bottom:14px; border-bottom:2px solid var(--border-strong); margin-bottom:14px;}
  .rx-sheet-clinic{font-family:var(--font-display); font-weight:800; font-size:15px;}
  .rx-sheet-row{display:flex; justify-content:space-between; font-size:12.5px; padding:7px 0; border-bottom:1px dashed var(--border);}
  .rx-sheet-meds{margin:16px 0 4px;}
  .rx-sheet-med{display:flex; align-items:center; gap:8px; padding:9px 11px; border-radius:9px; background:var(--surface-2); font-size:12.5px; font-weight:600; margin-bottom:6px;}
  .rx-sheet-sign{margin-top:24px; text-align:center; font-size:11.5px; color:var(--text-secondary);}
  .rx-sheet-sign-line{width:220px; border-top:1px solid var(--text-muted); margin:0 auto 6px;}
  .pdv-rx-pillnav{width:100%;}
  .pdv-rx-pillnav button{flex:1; text-align:center;}
  .pdv-rx-check{display:flex; align-items:flex-start; gap:7px; margin-top:9px; font-size:11.5px; color:var(--text-primary); cursor:pointer;}
  .pdv-rx-check input{margin-top:2px;}
  .pdv-rx-products{display:flex; flex-direction:column; gap:6px;}
  .pdv-rx-product-row{display:flex; align-items:center; gap:8px; padding:8px 10px; border-radius:8px; background:var(--surface-2);}
  .pdv-rx-done-note{display:flex; align-items:center; gap:6px; margin-top:14px; padding:10px 12px; border-radius:9px; background:var(--good-soft); font-size:11.5px; font-weight:700; color:var(--good);}
  .pdv-rx-choice{display:flex; flex-direction:column; gap:2px; align-items:flex-start; text-align:left; width:100%; border:1px solid var(--border-strong); border-radius:10px; padding:10px 12px; background:var(--surface); cursor:pointer;}
  .pdv-rx-choice:hover{border-color:var(--accent); background:var(--surface-2);}
  .pdv-rx-choice-title{font-size:12.5px; font-weight:700; color:var(--text-primary);}
  .rec-config{margin-top:8px; padding:10px 11px; border-radius:10px; background:var(--surface);}
  .rec-config-row{display:flex; align-items:center; justify-content:space-between; gap:8px;}
  .rec-config-label{font-size:11px; font-weight:700; color:var(--text-secondary);}
  .rec-stepper{display:flex; align-items:center; gap:8px;}
  .rec-stepper span{width:16px; text-align:center; font-size:12px;}
  .rec-pillnav{width:100%; margin-top:9px;}
  .rec-pillnav button{flex:1; text-align:center; font-size:10.5px; padding:6px 4px;}
  .rec-summary{display:flex; align-items:center; gap:6px; font-size:11.5px; font-weight:600; color:var(--text-primary); margin-bottom:9px;}
  .rec-cycle{display:flex; align-items:center; gap:6px; margin-top:9px; padding-top:9px; border-top:1px dashed var(--border); font-size:11px; font-weight:600; color:var(--text-secondary);}
  .rec-cycle.soon{color:var(--warning);}
  .rec-cycle.late{color:var(--critical);}
  .prod-row-icon{width:34px; height:34px; border-radius:9px; background:var(--surface-2); display:flex; align-items:center; justify-content:center; color:var(--text-muted); flex:none;}

  .chart-svg text{font-family:var(--font-body); fill:var(--text-muted);}
  .chart-axis-line{stroke:var(--border-strong);}
  .chart-grid-line{stroke:var(--border);}

  @keyframes printing-pulse{0%,100%{transform:scale(1); opacity:.9;} 50%{transform:scale(1.07); opacity:1;}}
  @keyframes printing-fill{from{width:0%;} to{width:100%;}}
  .printing-icon{display:flex; align-items:center; justify-content:center; width:64px; height:64px; border-radius:18px; background:var(--accent-soft); color:var(--accent); margin:0 auto; animation:printing-pulse 1.1s ease-in-out infinite;}
  .printing-bar{width:170px; height:4px; border-radius:4px; background:var(--surface-2); margin:16px auto 0; overflow:hidden;}
  .printing-bar-fill{height:100%; background:var(--accent); border-radius:4px; width:0%; animation:printing-fill 1.3s ease forwards;}

  @media (prefers-reduced-motion: reduce){
    *{ animation-iteration-count:1 !important; }
    .printing-icon{ animation:none; }
    .printing-bar-fill{ animation:none; width:100%; }
    html{ scroll-behavior:auto; }
  }

  ::-webkit-scrollbar{width:9px; height:9px;}
  ::-webkit-scrollbar-track{background:transparent;}
  ::-webkit-scrollbar-thumb{background:var(--border-strong); border-radius:5px;}

  /* ---------- keyboard focus ---------- */
  :focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }
  .btn:focus-visible, .icon-btn:focus-visible, .rail-item:focus-visible, .tab:focus-visible,
  .pillnav button:focus-visible, .switch:focus-visible, .identify-result:focus-visible,
  tr.clickable:focus-visible, .pdv-rx-choice:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }
  .rail-item:focus-visible{ outline-color:var(--rail-accent); outline-offset:-1px; }
  .input:focus-visible, .topbar-search input:focus-visible{ outline:none; }

  /* ---------- destructive confirm ---------- */
  .btn-danger-solid{ background:var(--critical); color:#fff; border-color:transparent; }
  .btn-danger-solid:hover{ filter:brightness(.93); }
  .btn-danger-solid[disabled]{ opacity:.45; cursor:not-allowed; }
  .confirm-body{ font-size:13px; line-height:1.55; color:var(--text-secondary); }
  .confirm-entity{ margin-top:12px; padding:9px 12px; border-radius:9px; background:var(--surface-2);
    border:1px solid var(--border); font-weight:700; font-size:12.5px; display:flex; align-items:center; gap:8px;
    word-break:break-word; }
  .confirm-entity svg{ flex:none; color:var(--text-muted); }
  .confirm-check{ display:flex; align-items:flex-start; gap:9px; margin-top:14px; padding:11px 12px;
    border-radius:10px; background:var(--warning-soft); font-size:12px; line-height:1.45;
    color:var(--text-primary); cursor:pointer; }
  .confirm-check input{ margin-top:2px; flex:none; width:15px; height:15px; accent-color:var(--accent); }

  /* ---------- undo toast ---------- */
  .toast-stack{ position:fixed; left:50%; bottom:22px; transform:translateX(-50%); z-index:200;
    display:flex; flex-direction:column-reverse; gap:8px; align-items:center; width:max-content;
    max-width:calc(100vw - 32px); pointer-events:none; }
  .toast{ pointer-events:auto; position:relative; overflow:hidden; display:flex; align-items:center; gap:13px; background:var(--surface);
    color:var(--text-primary); border:1px solid var(--border-strong); padding:10px 11px 10px 14px;
    border-radius:12px; box-shadow:var(--shadow-lg); font-size:12.5px; font-weight:600;
    animation:toast-in .22s cubic-bezier(.2,.8,.2,1); }
  .toast-progress{ position:absolute; left:0; bottom:0; height:2px; width:100%; transform-origin:left;
    background:var(--accent); opacity:.5; animation:toast-countdown linear forwards; }
  .toast.paused .toast-progress{ animation-play-state:paused; }
  @keyframes toast-countdown{ from{ transform:scaleX(1); } to{ transform:scaleX(0); } }
  .toast-icon{ color:var(--good); display:flex; flex:none; }
  .toast-action{ background:var(--accent-soft); border:none; color:var(--accent); font-weight:800;
    font-size:12px; cursor:pointer; padding:6px 11px; border-radius:8px; white-space:nowrap; font-family:inherit; }
  .toast-action:hover{ background:var(--accent-soft-strong); }
  .toast-close{ background:none; border:none; color:var(--text-muted); cursor:pointer; display:flex;
    padding:4px; border-radius:6px; }
  .toast-close:hover{ color:var(--text-primary); background:var(--surface-2); }
  @keyframes toast-in{ from{ opacity:0; transform:translateY(8px); } to{ opacity:1; transform:translateY(0); } }

  /* ---------- form validation ---------- */
  .input.invalid, select.input.invalid, textarea.input.invalid{ border-color:var(--critical); }
  .input.invalid:focus{ box-shadow:0 0 0 4px var(--critical-soft); }
  .field-error{ font-size:10.5px; font-weight:700; color:var(--critical); }

  /* ---------- rail: collapsible groups + persona ---------- */
  .rail-group-toggle{ display:flex; align-items:center; justify-content:space-between; gap:8px; width:100%;
    background:none; border:none; font:inherit; color:var(--rail-text-muted); cursor:pointer; font-size:10px;
    font-weight:700; letter-spacing:.09em; text-transform:uppercase; padding:0 10px 6px; }
  .rail-group-toggle:hover{ color:var(--rail-text); }
  .rail-group-toggle svg{ flex:none; opacity:.7; }
  .rail-user{ border-radius:9px; padding:3px; margin:-3px; }
  .rail-user:hover{ background:var(--rail-bg-2); }
  .rail-persona-menu{ margin:0 14px 8px; background:var(--rail-bg-2); border:1px solid var(--rail-border);
    border-radius:10px; overflow:hidden; }
  .rail-persona-opt{ display:flex; align-items:center; gap:9px; padding:8px 11px; font-size:12px; font-weight:600;
    color:var(--rail-text-muted); cursor:pointer; width:100%; text-align:left; background:none; border:none; font-family:inherit; }
  .rail-persona-opt:hover{ background:rgba(255,255,255,.10); color:var(--rail-text); }
  .rail-persona-opt.active{ background:rgba(255,255,255,.16); color:var(--rail-text); }

  /* ---------- command palette ---------- */
  .topbar-search.as-button{ cursor:pointer; }
  .topbar-search.as-button:hover{ background:var(--surface-3); }
  .cmdk-overlay{ position:fixed; inset:0; background:rgba(8,12,10,.5); z-index:120; display:flex;
    align-items:flex-start; justify-content:center; padding:13vh 20px 20px; backdrop-filter:blur(1.5px); }
  .cmdk{ width:100%; max-width:560px; background:var(--surface); border:1px solid var(--border);
    border-radius:16px; box-shadow:var(--shadow-lg); overflow:hidden; display:flex; flex-direction:column; max-height:64vh; }
  .cmdk-input{ display:flex; align-items:center; gap:10px; padding:13px 15px; border-bottom:1px solid var(--border); color:var(--text-muted); }
  .cmdk-input input{ flex:1; border:none; outline:none; background:none; font-size:14px; color:var(--text-primary); font-family:inherit; }
  .cmdk-input input::placeholder{ color:var(--text-muted); }
  .cmdk-kbd{ font-family:var(--font-mono); font-size:10px; font-weight:600; padding:2px 6px; border-radius:5px;
    background:var(--surface-2); border:1px solid var(--border); color:var(--text-muted); white-space:nowrap; }
  .cmdk-list{ overflow-y:auto; padding:6px; }
  .cmdk-empty{ padding:22px 14px; text-align:center; font-size:12.5px; color:var(--text-muted); }
  .cmdk-item{ display:flex; align-items:center; gap:11px; width:100%; text-align:left; border:none; background:none;
    padding:9px 11px; border-radius:9px; cursor:pointer; font-family:inherit; color:var(--text-primary); }
  .cmdk-item.sel{ background:var(--surface-2); }
  .cmdk-item-icon{ display:flex; flex:none; color:var(--text-muted); }
  .cmdk-item.sel .cmdk-item-icon{ color:var(--accent); }
  .cmdk-item-label{ font-size:12.75px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-width:0; }
  .cmdk-item-sub{ margin-left:auto; font-size:10.5px; color:var(--text-muted); white-space:nowrap; flex:none; padding-left:10px; }

  /* ---------- motion ---------- */
  /* continuity: overlays announce themselves; backdrops fade */
  .modal-overlay, .drawer-overlay, .cmdk-overlay{ animation:fade-in .12s ease-out; }
  .modal{ animation:pop-in .16s cubic-bezier(.16,1,.3,1); }
  .drawer{ animation:slide-in-right .22s cubic-bezier(.16,1,.3,1); }
  .cmdk{ animation:drop-in .14s cubic-bezier(.16,1,.3,1); }
  @keyframes fade-in{ from{ opacity:0; } to{ opacity:1; } }
  @keyframes pop-in{ from{ opacity:0; transform:scale(.97); } to{ opacity:1; transform:scale(1); } }
  @keyframes slide-in-right{ from{ transform:translateX(24px); opacity:.4; } to{ transform:translateX(0); opacity:1; } }
  @keyframes drop-in{ from{ opacity:0; transform:translateY(-6px); } to{ opacity:1; transform:translateY(0); } }

  /* continuity: the content region settles when the route changes */
  .route-fade{ animation:route-in .13s ease-out; }
  @keyframes route-in{ from{ opacity:0; transform:translateY(3px); } to{ opacity:1; transform:translateY(0); } }

  /* feedback: eased control states + tactile press */
  .btn, .icon-btn, .topbar-search.as-button{ transition:background .12s ease, border-color .12s ease, color .12s ease, transform .09s ease; }
  .btn:active:not([disabled]), .icon-btn:active, .topbar-search.as-button:active{ transform:scale(.97); }
  .rail-item, .tab, .cmdk-item, .rail-persona-opt, .rail-store, .identify-result, .pillnav button,
  .pdv-rx-choice, .tabs .tab{ transition:background .12s ease, color .12s ease, border-color .12s ease; }
  .switch{ transition:background .15s ease, border-color .15s ease; }
  .input, select.input, textarea.input, .identify-search{ transition:border-color .14s ease, box-shadow .14s ease; }
  .rail-item-badge{ transition:transform .12s ease; }
  tr.clickable{ transition:background .1s ease; }

  /* focal: sale completion — the fiscal note resolves */
  .printing-bar-fill{ animation:printing-fill 1.1s cubic-bezier(.4,0,.2,1) forwards; }
  .receipt-done{ animation:route-in .28s cubic-bezier(.16,1,.3,1); }
  .receipt-check{ animation:check-pop .34s cubic-bezier(.16,1,.3,1) backwards; }
  .receipt-check svg polyline{ stroke-dasharray:26; stroke-dashoffset:26; animation:check-draw .34s .12s cubic-bezier(.16,1,.3,1) forwards; }
  @keyframes check-pop{ from{ transform:scale(.5); opacity:0; } 60%{ transform:scale(1.06); } to{ transform:scale(1); opacity:1; } }
  @keyframes check-draw{ to{ stroke-dashoffset:0; } }

  @media (prefers-reduced-motion: reduce){
    .modal, .drawer, .cmdk, .modal-overlay, .drawer-overlay, .cmdk-overlay,
    .route-fade, .receipt-done, .receipt-check{ animation:none; }
    .btn:active:not([disabled]), .icon-btn:active, .topbar-search.as-button:active{ transform:none; }
    .receipt-check svg polyline{ animation:none; stroke-dashoffset:0; }
    .printing-bar-fill{ animation:none; width:100%; }
  }

  /* ---------- chat shell ---------- */
  .chat-shell{ display:grid; grid-template-columns:300px 1fr; height:calc(100vh - 190px); overflow:hidden; }

  /* ---------- responsive: off-canvas rail + reflow ---------- */
  .topbar-menu-btn{ display:none; flex:none; }
  .rail-scrim{ display:none; position:fixed; inset:0; background:rgba(8,12,10,.5); z-index:140; }

  /* small laptop / tablet landscape — collapse the 12-col dashboards + wide app shells */
  @media (max-width:1100px){
    .grid.g-12 > *{ grid-column:1 / -1 !important; }
    .pdv-shell{ grid-template-columns:1fr; height:auto; }
    .pdv-cart{ max-height:none; }
    .content{ padding:20px 18px 36px; }
  }

  /* tablet portrait and below — rail becomes an off-canvas drawer */
  @media (max-width:860px){
    .rail{
      position:fixed; left:0; top:0; height:100vh; height:100dvh; width:264px !important; z-index:150;
      transform:translateX(-100%); transition:transform .24s cubic-bezier(.4,0,.2,1);
      box-shadow:0 0 40px rgba(0,0,0,.28);
    }
    .rail.open{ transform:translateX(0); }
    .rail-scrim{ display:block; }
    .rail-collapse-btn{ display:none; }
    .topbar-menu-btn{ display:flex; }
    .topbar{ padding:0 14px; gap:10px; }
    .content{ padding:16px 14px 32px; }
    .chat-shell{ grid-template-columns:1fr; grid-template-rows:auto 1fr; height:calc(100vh - 156px); height:calc(100dvh - 156px); }
    .chat-list{ max-height:200px; border-right:none !important; border-bottom:1px solid var(--border); }
    .page-head{ margin-bottom:16px; }
    .modal-overlay{ padding:16px; }
    .cmdk-overlay{ padding:10vh 14px 14px; }
  }
  @media (max-width:860px) and (prefers-reduced-motion: reduce){ .rail{ transition:none; } }

  /* phone */
  @media (max-width:560px){
    .content{ padding:12px 11px 26px; }
    .topbar{ height:56px; padding:0 11px; }
    .topbar-search.as-button{ width:38px !important; padding:0; justify-content:center; }
    .topbar-search.as-button > span, .topbar-search.as-button > .cmdk-kbd{ display:none; }
    .page-title{ font-size:20px; }
    .page-actions{ width:100%; }
    .g-2, .grid.g-2{ grid-template-columns:1fr; }
    .modal-overlay{ padding:10px; }
    .modal{ max-height:92vh; }
    .drawer{ max-width:100%; }
    .cmdk-overlay{ padding:7vh 10px 10px; }
    .stat-value{ font-size:21px; }
  }
